replicaCount: 1
fullnameOverride: "mysql-service"
mysqlRootPassword: "admin"
mysqlDatabase: "wordpress"
image:
  repository: mysql
  tag: "5.6"
  pullPolicy: IfNotPresent
deployment:
  name: mysql-deployment
service:
  name: mysql-service
  type: ClusterIP
  port: 3306
autoscaling:
  enabled: false
serviceAccount:
  create: false
  name: ""
